name: 问题反馈
description: 功能异常、报错或播放失败
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: IceTV 版本
      description: 右上角用户菜单中显示的版本号
      placeholder: 例如 0.7.5
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker + SQLite
        - Docker + MySQL
        - Vercel + MySQL
        - 其他
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: 设备与浏览器
      placeholder: 例如 Windows 11 / Chrome 131，iPhone / Safari
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 浏览器控制台、容器日志（docker compose logs）或截图
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 已移除资源站地址、密钥、Cookie 等私密信息
          required: true
