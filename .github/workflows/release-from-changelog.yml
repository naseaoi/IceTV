name: Sync GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'push' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare release metadata
        id: prepare
        run: node scripts/prepare-release.js

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Stop on tag mismatch
        if: github.event_name == 'push' && github.ref_name != steps.prepare.outputs.tag
        run: |
          echo "当前推送 tag 为 ${{ github.ref_name }}，CHANGELOG 顶部版本为 ${{ steps.prepare.outputs.tag }}。"
          exit 1

      - name: Check tag state
        id: tag_state
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            head_commit="$(git rev-parse HEAD)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
            echo "head_commit=$head_commit" >> "$GITHUB_OUTPUT"
            if [ "$tag_commit" = "$head_commit" ]; then
              echo "same_commit=true" >> "$GITHUB_OUTPUT"
            else
              echo "same_commit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "same_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when tag is missing
        if: steps.tag_state.outputs.exists != 'true'
        run: |
          echo "未找到 ${{ steps.prepare.outputs.tag }} tag。请先在 main 发布提交上创建并推送 tag。"
          exit 1

      - name: Stop on released version drift
        if: steps.tag_state.outputs.exists == 'true' && steps.tag_state.outputs.same_commit != 'true'
        run: |
          echo "CHANGELOG 顶部版本 ${{ steps.prepare.outputs.tag }} 已在提交 ${{ steps.tag_state.outputs.tag_commit }} 发布。"
          echo "当前提交为 ${{ steps.tag_state.outputs.head_commit }}。请递增 CHANGELOG 顶部版本后再继续发布。"
          exit 1

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.title }}
          RELEASE_NOTES_FILE: ${{ steps.prepare.outputs.notes_file }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi
