name: Build & Push Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 标签，留空时使用 CHANGELOG 顶部版本'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}
      tags: ${{ steps.tags.outputs.tags }}
      app_version: ${{ steps.tags.outputs.app_version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve tag kind
        id: tag_kind
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "kind=manual" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "kind=dev" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "不支持的 Docker 构建 tag: $REF_NAME"
          echo "正式版本使用 vX.Y.Z，dev 预发布使用 vX.Y.Z-dev.N。"
          exit 1

      - name: Prepare release metadata
        if: steps.tag_kind.outputs.kind != 'dev'
        id: release
        run: node scripts/prepare-release.js

      - name: Stop on tag mismatch
        if: github.event_name == 'push' && steps.tag_kind.outputs.kind == 'stable' && github.ref_name != steps.release.outputs.tag
        run: |
          echo "当前推送 tag 为 ${{ github.ref_name }}，CHANGELOG 顶部版本为 ${{ steps.release.outputs.tag }}。"
          exit 1

      - name: Set lowercase repository owner
        id: image
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: tags
        env:
          IMAGE_NAME: ghcr.io/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
          VERSION_TAG: ${{ steps.release.outputs.version }}
          TAG_KIND: ${{ steps.tag_kind.outputs.kind }}
          TAG_VERSION: ${{ steps.tag_kind.outputs.version }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            raw_tags="$MANUAL_TAG"
            app_version="${VERSION_TAG:-${MANUAL_TAG#v}}"
          elif [ "$TAG_KIND" = "dev" ]; then
            raw_tags="$TAG_VERSION dev"
            app_version="$TAG_VERSION"
          else
            raw_tags="$VERSION_TAG latest"
            app_version="$VERSION_TAG"
          fi

          {
            echo "tags<<EOF"
            for tag in $raw_tags; do
              echo "$IMAGE_NAME:$tag"
            done
            echo "EOF"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Prepare platform name
        run: |
          echo "PLATFORM_NAME=${{ matrix.platform }}" | sed 's|/|-|g' >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.prepare.outputs.app_version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image }}
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r image_tag; do
            if [ -n "$image_tag" ]; then
              tag_args+=("-t" "$image_tag")
            fi
          done <<< "$IMAGE_TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "$IMAGE_NAME@sha256:%s " *)
